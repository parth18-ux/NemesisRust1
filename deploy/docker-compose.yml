# Local bank style deployment: Redis holds account state and the payment streams; workers are stateless and
# each owns one partition (payer hash mod PARTITIONS). Add workers by adding services with the next PARTITION
# and raising --partitions for the replay. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml run --rm replay      # streams a payments CSV through the workers
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    ports: ["8000:8000"]
  worker-0:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["rusetect-worker", "--partition", "0"]
    environment: {REDIS_URL: "redis://redis:6379/0"}
    depends_on: [redis]
  worker-1:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["rusetect-worker", "--partition", "1"]
    environment: {REDIS_URL: "redis://redis:6379/0"}
    depends_on: [redis]
  replay:
    build: {context: .., dockerfile: deploy/Dockerfile}
    profiles: ["tools"]
    command: ["rusetect-replay", "--csv", "/data/payments.csv.gz", "--partitions", "2"]
    environment: {REDIS_URL: "redis://redis:6379/0"}
    volumes: ["../data:/data:ro"]
    depends_on: [redis]
