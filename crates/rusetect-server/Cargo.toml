[package]
name = "rusetect-server"
description = "RuseTect HTTP API, Live Console and the Redis-backed streaming scoring workers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "rusetect_server"
path = "src/lib.rs"

[[bin]]
name = "rusetect-server"
path = "src/main.rs"

[[bin]]
name = "rusetect-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "rusetect-replay"
path = "src/bin/replay.rs"

[dependencies]
rusetect = { path = "../rusetect" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
anyhow.workspace = true
rand.workspace = true
glob.workspace = true
csv.workspace = true
flate2.workspace = true
chrono.workspace = true
crc32fast.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
redis = { version = "0.27", default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
fancy-regex.workspace = true
base64.workspace = true
